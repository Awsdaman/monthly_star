<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نجوم الشهر · نادي الحاسبات</title>
<meta name="description" content="نجوم الشهر في نادي الحاسبات: تجربة تفاعلية لكل نجم ونجمة، بأربعة أساليب.">
<meta name="theme-color" content="#0c272c">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_SA">
<meta property="og:title" content="نجوم الشهر · نادي الحاسبات">
<meta property="og:description" content="وصلتك رسالة من نادي الحاسبات… افتحها لتكتشف ماستك.">
<meta property="og:image" content="/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/core.css">
<style>
/* The live shell: four experiences behind one personal link, switched by a bottom tab bar
   (thumb reach on phones). Each experience runs in its own frame so its sound, timers and
   state are fully reset when the member switches tabs. */
html, body { height: 100%; overflow: hidden; }
body { display: flex; flex-direction: column; background: var(--abyss); }
.view { position: relative; flex: 1; min-height: 0; }
.view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--abyss); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity .4s; }
.loading svg { width: 54px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); opacity: .6; } }
.view.ready .loading { opacity: 0; }

.tabs {
  position: relative; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  background: #081d21; box-shadow: 0 -1px 0 var(--line);
}
.tab {
  position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 6px; min-height: 56px;
  border: 0; background: none; color: var(--ink-2); font: inherit; font-size: .76rem; font-weight: 600; cursor: pointer;
  border-radius: 12px; transition: color .25s, background-color .25s;
}
.tab svg { width: 24px; height: 24px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--sand); background: rgba(201, 178, 138, .12); }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: -9px; width: 10px; height: 12px; background: var(--taupe-hi); clip-path: polygon(50% 0, 100% 40%, 50% 100%, 0 40%); }
@media (min-width: 900px) {
  .tabs { max-width: 620px; width: 100%; margin: 0 auto 14px; border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 16px 40px rgba(0, 0, 0, .4); }
  body { background: radial-gradient(70% 60% at 50% 40%, #12393f, var(--abyss)); }
}

/* picker: only when the link carries no name */
.picker { position: fixed; inset: 0; z-index: 20; overflow: auto; background: var(--abyss);
  padding: calc(40px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.picker[hidden] { display: none; }
.picker .in { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
.picker h1 { margin: 0; font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.6rem); color: #fff; line-height: 1.25; }
.picker p { margin: 0; color: var(--ink-2); }
.group h2 { margin: 6px 0 8px; font-size: .9rem; font-weight: 600; color: var(--taupe-hi); }
.group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.group a { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(207, 229, 232, .06); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); text-decoration: none; font-weight: 600; }
.group a:hover { background: rgba(207, 229, 232, .12); }
.group a span { font-size: .78rem; font-weight: 400; color: var(--ink-2); }
</style>
</head>
<body>
<main class="view" id="view">
  <div class="loading" aria-hidden="true"><svg viewBox="0 0 200 160"><g stroke="#0c272c" stroke-width="8" stroke-linejoin="round"><polygon points="58,12 20,58 65,60" fill="#9fd6de"/><polygon points="58,12 100,12 65,60" fill="#e4f1f2"/><polygon points="100,12 65,60 135,60" fill="#cbe6e9"/><polygon points="100,12 142,12 135,60" fill="#dcecee"/><polygon points="142,12 180,58 135,60" fill="#5fb0bd"/><polygon points="20,58 65,60 100,148" fill="#358b9a"/><polygon points="65,60 135,60 100,148" fill="#9fd6de"/><polygon points="135,60 180,58 100,148" fill="#2a636d"/></g></svg></div>
  <iframe id="frame" title="تجربة نجم الشهر" allow="autoplay; web-share; clipboard-write"></iframe>
</main>

<nav class="tabs" role="tablist" aria-label="أسلوب التجربة">
  <button class="tab" role="tab" data-tab="cut" aria-controls="view" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M12 20 9 9l3-5 3 5z"/></svg>الصقل</button>
  <button class="tab" role="tab" data-tab="grade" aria-controls="view" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 11h7M9 14h5"/><circle cx="14" cy="18" r="2"/></svg>التقرير</button>
  <button class="tab" role="tab" data-tab="compile" aria-controls="view" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>التجميع</button>
  <button class="tab" role="tab" data-tab="island" aria-controls="view" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 15l10-5 10 5-10 5z"/><path d="M8 13V8l4-2v6M12 6l4 2v5"/></svg>الجزيرة</button>
</nav>

<section class="picker" id="picker" hidden aria-labelledby="pickTitle">
  <div class="in">
    <h1 id="pickTitle">نجوم الشهر</h1>
    <p id="pickLead"></p>
    <div id="groups"></div>
  </div>
</section>

<script src="assets/core.js"></script>
<script>
(function () {
  var S = window.SOTM, $ = S.$;
  var TABS = ['cut', 'grade', 'compile', 'island'];
  var frame = $('#frame'), view = $('#view');
  var q = new URLSearchParams(location.search);
  var hasName = !!(q.get('n') || q.get('name'));

  // pass the personal parameters through to each experience untouched
  function pageUrl(tab) {
    var p = new URLSearchParams();
    ['n', 'name', 'g', 'c'].forEach(function (k) { if (q.get(k)) p.set(k, q.get(k)); });
    return tab + '.html?' + p.toString();
  }
  function current() { var h = location.hash.slice(1); return TABS.indexOf(h) >= 0 ? h : 'cut'; }
  function show(tab, focus) {
    S.$$('.tab').forEach(function (b) {
      var on = b.dataset.tab === tab;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
    });
    view.classList.remove('ready');
    frame.src = pageUrl(tab);
  }
  frame.addEventListener('load', function () { view.classList.add('ready'); try { frame.contentWindow.focus(); } catch (e) {} });
  S.$$('.tab').forEach(function (b, i) {
    b.addEventListener('click', function () { if (location.hash.slice(1) !== b.dataset.tab) location.hash = b.dataset.tab; else show(b.dataset.tab); });
    b.addEventListener('keydown', function (e) {
      var k = e.key === 'ArrowLeft' ? 1 : e.key === 'ArrowRight' ? -1 : 0; // RTL: left moves forward
      if (!k) return;
      e.preventDefault(); location.hash = TABS[(i + k + TABS.length) % TABS.length];
      setTimeout(function () { document.querySelector('.tab[aria-selected="true"]').focus(); }, 0);
    });
  });
  addEventListener('hashchange', function () { show(current()); });

  if (hasName) {
    show(current());
  } else {
    // no name in the link: list this month's stars so the right personal link is opened
    $('#picker').hidden = false;
    $('#pickLead').textContent = 'نجوم شهر ' + S.CONFIG.month + ' ' + S.CONFIG.year + '. اختر الاسم لفتح رابطه الشخصي.';
    var by = {};
    S.MEMBERS.forEach(function (m) { (by[m.committee] = by[m.committee] || []).push(m); });
    Object.keys(by).forEach(function (c) {
      var g = document.createElement('section'); g.className = 'group';
      g.innerHTML = '<h2>' + c + '</h2><ul></ul>';
      by[c].forEach(function (m) {
        var li = document.createElement('li'), a = document.createElement('a');
        a.href = '?n=' + encodeURIComponent(S.slug(m.name));
        a.innerHTML = '<b></b><span></span>';
        a.querySelector('b').textContent = m.name;
        a.querySelector('span').textContent = m.g === 'f' ? 'نجمة الشهر' : 'نجم الشهر';
        li.appendChild(a); g.querySelector('ul').appendChild(li);
      });
      $('#groups').appendChild(g);
    });
    document.querySelector('.tabs').hidden = true;
    document.title = 'نجوم الشهر · نادي الحاسبات';
  }
})();
</script>
</body>
</html>
