<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجميع الماسة</title>
<meta name="theme-color" content="#0c272c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/core.css">
<style>
/* Concept D — the Computer Club's own medium: a terminal scans the club, then
   thousands of pixels compile into the diamond, and recompile into the member's name.
   Layout: terminal on top, a full-bleed pixel field behind, reveal at the bottom. */
body { height: 100%; overflow: hidden; background: #081d21; }
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.grid-bg { position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(53, 139, 154, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(53, 139, 154, .07) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-mask: radial-gradient(80% 60% at 50% 45%, #000, transparent); mask: radial-gradient(80% 60% at 50% 45%, #000, transparent);
}

.term {
  position: fixed; z-index: 10; left: 50%; top: calc(72px + env(safe-area-inset-top, 0px));
  width: min(calc(100% - 32px), 560px); translate: -50% 0;
  background: rgba(6, 22, 25, .86); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-radius: 12px; box-shadow: 0 0 0 1px rgba(53, 139, 154, .35), 0 24px 60px rgba(0, 0, 0, .5);
  overflow: hidden; transition: transform 1s var(--ease-out), opacity .8s, top 1s var(--ease-out);
}
.term.away { transform: translateY(-30px) scale(.96); opacity: 0; pointer-events: none; }
.term__bar { display: flex; align-items: center; gap: 7px; padding: 10px 14px; direction: ltr; border-bottom: 1px solid rgba(53, 139, 154, .25); }
.term__bar i { width: 11px; height: 11px; border-radius: 50%; background: rgba(207, 229, 232, .2); }
.term__bar i:first-child { background: #9f895c; }
.term__bar span { margin-left: auto; font-family: var(--font-mono); font-size: .72rem; color: var(--ink-2); }
.term__body { padding: 14px 16px 16px; min-height: 240px; max-height: 46svh; overflow: hidden; font-family: var(--font-mono); font-size: .84rem; line-height: 1.75; }
.ln { white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.cmd { direction: ltr; text-align: left; color: var(--mist); }
.ln.cmd .ps { color: var(--taupe-hi); }
.ln.out { direction: rtl; text-align: right; font-family: var(--font-ar); color: var(--ink-2); font-size: .86rem; }
.ln.out b { color: var(--mist); font-weight: 600; }
.ln.ok { color: #9fe0c5; }
.ln.gold { color: var(--taupe-hi); }
.bar { display: inline-block; direction: ltr; font-family: var(--font-mono); color: var(--teal); letter-spacing: -1px; }
.caret { display: inline-block; width: .6em; height: 1.1em; vertical-align: -.2em; background: var(--mist); animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* run key: an Enter keycap */
.run {
  position: fixed; z-index: 12; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); translate: -50% 0;
  display: grid; justify-items: center; gap: 12px; text-align: center; transition: opacity .5s, transform .6s var(--ease-out);
}
.run[hidden] { display: none; }
.run p { margin: 0; color: var(--ink-2); font-size: .95rem; }
.keycap {
  position: relative; min-width: 190px; height: 64px; padding: 0 26px; border: 0; border-radius: 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  font-family: var(--font-ar); font-weight: 700; font-size: 1.05rem; color: var(--abyss);
  background: linear-gradient(180deg, #f4fbfb, #cfe5e8);
  box-shadow: 0 6px 0 #6f9da3, 0 14px 24px rgba(0, 0, 0, .45);
  transition: transform .08s, box-shadow .08s;
}
.keycap kbd { font-family: var(--font-mono); font-size: .8rem; color: var(--deep); }
.keycap:active, .keycap.down { transform: translateY(5px); box-shadow: 0 1px 0 #6f9da3, 0 6px 12px rgba(0, 0, 0, .4); }
.keycap svg { width: 22px; height: 22px; }

/* mascot: بِت, a pixel sprite */
.bit { position: fixed; z-index: 11; width: 64px; height: 64px; image-rendering: pixelated; transition: left 1s var(--ease-out), top 1s var(--ease-out); }
.bit svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; animation: hop 1.2s steps(2) infinite; }
@keyframes hop { 50% { transform: translateY(-4px); } }
.bit .blink { animation: bl 3.2s steps(1) infinite; }
@keyframes bl { 0%, 90% { opacity: 1; } 92%, 96% { opacity: 0; } }
.bit .say {
  position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; width: max-content; max-width: 200px;
  font-family: var(--font-ar); font-size: .82rem; font-weight: 600; line-height: 1.45; color: var(--abyss); background: var(--mist);
  padding: .45em .8em; border-radius: 3px; box-shadow: 3px 3px 0 var(--teal); opacity: 0; transition: opacity .25s;
}
.bit .say.show { opacity: 1; }

/* reveal */
.reveal {
  position: fixed; z-index: 12; inset-inline: 0; bottom: 0; display: grid; justify-items: center; gap: 10px; text-align: center;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.reveal[hidden] { display: none; }
.reveal > * { animation: rise .8s var(--ease-out) both; }
.reveal > :nth-child(2) { animation-delay: .15s; } .reveal > :nth-child(3) { animation-delay: .3s; } .reveal > :nth-child(4) { animation-delay: .45s; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.role { display: flex; flex-wrap: wrap; justify-content: center; gap: .3em .7em; font-size: clamp(1rem, 4vw, 1.2rem); }
.role b { color: var(--taupe-hi); }
.role span { color: var(--ink-2); }
.msg { margin: 0; max-width: 34ch; font-weight: 300; color: var(--ink); text-wrap: pretty; }
.slogan { margin: 0; font-size: .82rem; color: var(--taupe-hi); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.actions .btn { min-height: 48px; padding: 0 1.3em; font-size: .95rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.touch-hint { font-size: .78rem; color: rgba(169, 201, 205, .7); }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="grid-bg" aria-hidden="true"></div>

<section class="term" id="term" aria-label="الطرفية">
  <div class="term__bar"><i></i><i></i><i></i><span>computer-club — star-of-the-month</span></div>
  <div class="term__body" id="out" aria-live="polite"></div>
</section>

<div class="bit" id="bit" aria-hidden="true">
  <div class="say" id="bitSay"></div>
  <svg viewBox="0 0 16 16" id="bitSvg"></svg>
</div>

<div class="run" id="run" hidden>
  <p id="runHint"></p>
  <button class="keycap" id="runBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v7a3 3 0 0 1-3 3H5m0 0 4-4m-4 4 4 4"/></svg><span id="runLabel"></span><kbd>Enter</kbd></button>
</div>

<section class="reveal" id="reveal" hidden>
  <h1 class="sr" id="srName"></h1>
  <div class="role"><b id="title"></b><span id="committee"></span></div>
  <p class="msg" id="msg"></p>
  <p class="slogan" id="slogan"></p>
  <div class="actions">
    <button class="btn btn--gold" id="saveBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg><span id="saveLabel"></span></button>
    <button class="btn btn--ghost" id="shareBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/></svg>مشاركة</button>
    <button class="btn btn--ghost" id="againBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>من جديد</button>
  </div>
  <p class="touch-hint" id="touchHint"></p>
</section>

<script src="assets/core.js"></script>
<script>
(function () {
  var S = window.SOTM, m = S.member, G = S.G, $ = S.$;
  S.sound.mountButton();

  /* ---------- Bit, the pixel sprite ---------- */
  var BIT = [
    '................',
    '......XX........',
    '......XG........',
    '....MMMMMMMM....',
    '...MMMMMMMMMM...',
    '..MMMMMMMMMMMM..',
    '..MMKKMMMMKKMM..',
    '..MMKKMMMMKKMM..',
    '..MMMMMMMMMMMM..',
    '..MMMMKKKKMMMM..',
    '..MMMMMMMMMMMM..',
    '...TTTTTTTTTT...',
    '...TTTTTTTTTT...',
    '...TT......TT...',
    '...TT......TT...',
    '................'];
  var COL = { M: '#cfe5e8', K: '#0c272c', T: '#358b9a', X: '#9f895c', G: '#e9dcc3' };
  var svg = '';
  BIT.forEach(function (row, y) { for (var x = 0; x < 16; x++) { var ch = row[x]; if (COL[ch]) svg += '<rect class="' + (ch === 'K' && y < 8 ? 'blink' : '') + '" x="' + x + '" y="' + y + '" width="1" height="1" fill="' + COL[ch] + '"/>'; } });
  $('#bitSvg').innerHTML = svg;
  var bit = $('#bit'), bitSay = $('#bitSay');
  function bitTo(x, y) { bit.style.left = x + 'px'; bit.style.top = y + 'px'; }
  function bitTalk(t, ms) { bitSay.textContent = t; bitSay.classList.add('show'); clearTimeout(bitTalk.h); if (ms) bitTalk.h = setTimeout(function () { bitSay.classList.remove('show'); }, ms); }
  function placeBit() {
    var t = $('#term').getBoundingClientRect();
    bitTo(t.left + 12, t.bottom + 10);
  }
  placeBit(); addEventListener('resize', function () { if (!$('#term').classList.contains('away')) placeBit(); });

  /* ---------- terminal script ---------- */
  var out = $('#out');
  var monthSlug = 'oct-2026';
  function line(cls, html) { var d = document.createElement('div'); d.className = 'ln ' + cls; d.innerHTML = html || ''; out.appendChild(d); while (out.scrollHeight > out.clientHeight + 4 && out.children.length > 1) out.removeChild(out.firstChild); return d; }
  function typeCmd(text) {
    return new Promise(function (res) {
      var d = line('cmd', '<span class="ps">$</span> '), i = 0, span = document.createElement('span'), caret = document.createElement('span');
      caret.className = 'caret'; d.appendChild(span); d.appendChild(caret);
      (function tick() {
        span.textContent = text.slice(0, ++i); if (i % 2) S.sound.play('key');
        if (i < text.length) setTimeout(tick, S.reducedMotion() ? 0 : 28 + Math.random() * 40); else { caret.remove(); setTimeout(res, 250); }
      })();
    });
  }
  function bar(label, ms) {
    return new Promise(function (res) {
      var d = line('out', '<b>' + label + '</b> <span class="bar"></span> <span class="pc">٠٪</span>'), b = d.querySelector('.bar'), pc = d.querySelector('.pc'), k = 0, N = 12;
      var ar = function (n) { return String(n).replace(/\d/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'[c]; }); };
      (function step() {
        k++; b.textContent = '█'.repeat(k) + '░'.repeat(N - k); pc.textContent = ar(Math.round(k / N * 100)) + '٪';
        if (k % 3 === 0) S.sound.play('tick');
        if (k < N) setTimeout(step, ms / N); else setTimeout(res, 120);
      })();
    });
  }
  var wait = S.wait;
  var started = false;

  function boot() {
    line('out', 'نادي الحاسبات · نظام نجوم الشهر <b>v2026.10</b>');
    setTimeout(function () { bitTalk(G('أنا بِت! سأبحث عن نجمة هذا الشهر.', 'أنا بِت! سأبحث عن نجم هذا الشهر.'), 3800); }, 600);
    wait(900).then(function () { return typeCmd('./scan --club=computer --month=' + monthSlug); })
      .then(function () { line('out', 'جارٍ مسح <b>٦ لجان</b> و<b>١٧ عضوًا</b>…'); return wait(500); })
      .then(function () { return bar('الشغف', 700); })
      .then(function () { return bar('العطاء', 600); })
      .then(function () { return bar('الإبداع', 600); })
      .then(function () { return bar('روح الفريق', 500); })
      .then(function () { var d = line('out gold', '✦ وُجدت إشارة ماسية في <b>' + m.committee + '</b>'); S.sound.play('ping', 1.1); return wait(700); })
      .then(function () { return typeCmd('compile diamond.dmd --for=' + '█'.repeat(Math.min(10, m.name.length))); })
      .then(function () { line('out', G('التجميع جاهز. ينتظر أمركِ.', 'التجميع جاهز. ينتظر أمرك.')); $('#run').hidden = false; bitTalk(G('اضغطي Enter لنبدأ!', 'اضغط Enter لنبدأ!'), 0); });
  }

  /* ---------- pixel field ---------- */
  var cv = $('#field'), cx = cv.getContext('2d'), W = 0, H = 0, DPR = 1, P = [], mode = 'drift', pointer = { x: -999, y: -999, on: false };
  var COLORS = ['#cfe5e8', '#358b9a', '#5fb0bd', '#ffffff', '#c9b28a', '#2a636d'];
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (mode === 'diamond') setTargets(diamondPoints());
    if (mode === 'name') setTargets(namePoints());
  }
  var COUNT = Math.round(Math.min(2600, Math.max(1300, innerWidth * innerHeight / 260)));
  for (var i = 0; i < COUNT; i++) {
    P.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, vx: 0, vy: 0, tx: null, ty: null,
      s: Math.random() < 0.85 ? 2 : 3, c: COLORS[i % COLORS.length], d: Math.random() * 6.28, a: 0.25 + Math.random() * 0.5 });
  }
  resize(); addEventListener('resize', resize);

  function sample(drawFn, gap) {
    var o = document.createElement('canvas'); o.width = W; o.height = H;
    var g = o.getContext('2d'); drawFn(g);
    var data = g.getImageData(0, 0, W, H).data, pts = [];
    for (var y = 0; y < H; y += gap) for (var x = 0; x < W; x += gap) if (data[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
    return pts;
  }
  function diamondPoints() {
    var w = Math.min(W * 0.78, 420), cy = H * 0.42;
    return sample(function (g) {
      S.drawDiamond(g, W / 2, cy, w, { fills: ['rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0)'], stroke: '#fff', lineWidth: 5 });
    }, W < 500 ? 3 : 4);
  }
  var nameLines = [];
  function namePoints() {
    var maxW = W * 0.88, fs = Math.min(W * 0.2, 150);
    var c = document.createElement('canvas').getContext('2d');
    // one line if it fits large enough, otherwise first name / rest
    c.font = '800 ' + fs + 'px Alexandria';
    nameLines = [m.name];
    if (c.measureText(m.name).width > maxW) {
      var one = S.fitText(c, m.name, maxW, fs, '800', 'Alexandria');
      if (one < fs * 0.62 && m.rest) { nameLines = [m.first, m.rest]; fs = Math.min(S.fitText(c, m.first, maxW, fs, '800', 'Alexandria'), S.fitText(c, m.rest, maxW, fs, '800', 'Alexandria')); }
      else fs = one;
    }
    var lh = fs * 1.15, top = H * 0.4 - (nameLines.length - 1) * lh / 2;
    return sample(function (g) {
      g.fillStyle = '#fff'; g.font = '800 ' + fs + 'px Alexandria'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.direction = 'rtl';
      nameLines.forEach(function (l, i) { g.fillText(l, W / 2, top + i * lh); });
    }, W < 500 ? 3 : 4);
  }
  function setTargets(pts) {
    // shuffle so the assembly reads as a swarm, not a scan line
    for (var i = pts.length - 1; i > 0; i--) { var j = (Math.random() * (i + 1)) | 0, t = pts[i]; pts[i] = pts[j]; pts[j] = t; }
    P.forEach(function (p, i) {
      if (i < pts.length) { p.tx = pts[i][0]; p.ty = pts[i][1]; p.a = 1; }
      else { p.tx = null; p.ty = null; p.a = 0.18 + Math.random() * 0.3; }
    });
  }
  function scatter(power) {
    P.forEach(function (p) { var a = Math.random() * 6.28, sp = Math.random() * power; p.vx += Math.cos(a) * sp; p.vy += Math.sin(a) * sp; });
  }

  cv.addEventListener('pointermove', function (e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true; });
  cv.addEventListener('pointerdown', function (e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.on = true; });
  cv.addEventListener('pointerleave', function () { pointer.on = false; });
  cv.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') pointer.on = false; });

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(2, (now - last) / 16.7); last = now;
    cx.clearRect(0, 0, W, H);
    var R = 70;
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (p.tx != null) {
        p.vx += (p.tx - p.x) * 0.012 * dt; p.vy += (p.ty - p.y) * 0.012 * dt;
        p.vx *= 0.86; p.vy *= 0.86;
      } else {
        p.d += 0.01 * dt; p.vx += Math.cos(p.d) * 0.02; p.vy += Math.sin(p.d) * 0.02 + 0.004;
        p.vx *= 0.98; p.vy *= 0.98;
        if (p.y > H + 10) p.y = -10; if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -12) p.y = H + 8;
      }
      if (pointer.on) {
        var dx = p.x - pointer.x, dy = p.y - pointer.y, d2 = dx * dx + dy * dy;
        if (d2 < R * R) { var f = (1 - Math.sqrt(d2) / R) * 2.2; var dd = Math.sqrt(d2) || 1; p.vx += dx / dd * f; p.vy += dy / dd * f; }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      cx.globalAlpha = p.a; cx.fillStyle = p.c; cx.fillRect(p.x, p.y, p.s, p.s);
    }
    cx.globalAlpha = 1;
    if (!stepping) requestAnimationFrame(frame);
  }
  var stepping = false;
  requestAnimationFrame(frame);
  // ?debug: let a test advance the physics without waiting on real frames
  if (/[?&]debug\b/.test(location.search)) window.__step = function (n) { stepping = true; for (var k = 0; k < n; k++) { last = performance.now() - 16.7; frame(performance.now()); } stepping = false; };

  /* ---------- run ---------- */
  function run() {
    if (started) return; started = true;
    S.sound.unlock(); S.sound.startMusic();
    $('#runBtn').classList.add('down'); setTimeout(function () { $('#runBtn').classList.remove('down'); }, 120);
    S.sound.play('blip');
    $('#run').hidden = true; bitTalk('جارٍ التجميع…', 2000);
    var d = line('ok', 'compiling ██████████ done'); d.className = 'ln cmd ok';
    setTimeout(function () {
      $('#term').classList.add('away');
      bitTo(16, innerHeight * 0.14);
      mode = 'diamond'; S.fontsReady(['800 100px Alexandria']).then(function () { setTargets(diamondPoints()); });
      S.sound.play('whoosh');
      setTimeout(function () { S.sound.play('ping', 0.8); bitTalk('هذه هي الماسة!', 2200); }, 1800);
      setTimeout(function () {
        scatter(14); S.sound.play('chisel');
        mode = 'name'; setTargets(namePoints());
        S.sound.play('whoosh');
      }, 4200);
      setTimeout(function () {
        S.sound.play('reveal');
        S.burst(innerWidth / 2, innerHeight * 0.4, 70, { speed: 10, lift: 4 });
        $('#srName').textContent = m.name;
        $('#reveal').hidden = false;
        bitTalk(G('ألف مبروك يا نجمتنا!', 'ألف مبروك يا نجمنا!'), 4000);
      }, 6400);
    }, 600);
  }
  $('#runBtn').addEventListener('click', run);
  addEventListener('keydown', function (e) { if (e.key === 'Enter' && !$('#run').hidden) { e.preventDefault(); run(); } });

  $('#runHint').textContent = G('كل شيء جاهز. شغّلي البرنامج.', 'كل شيء جاهز. شغّل البرنامج.');
  $('#runLabel').textContent = G('شغّلي', 'شغّل');
  $('#title').textContent = m.title;
  $('#committee').textContent = m.committee + ' · ' + S.CONFIG.month + ' ' + S.CONFIG.year;
  $('#msg').textContent = G('تألّقكِ لم يكن خطأً في الكود. كان نتيجة شغفكِ وعطائكِ وجهدكِ المستمر. استمري في الإبداع.',
    'تألّقك لم يكن خطأً في الكود. كان نتيجة شغفك وعطائك وجهدك المستمر. استمر في الإبداع.');
  $('#slogan').textContent = S.CONFIG.slogan;
  $('#saveLabel').textContent = G('احفظي البطاقة', 'احفظ البطاقة');
  $('#touchHint').textContent = G('المسي اسمكِ لتبعثري البكسلات.', 'المس اسمك لتبعثر البكسلات.');
  $('#againBtn').addEventListener('click', function () { location.reload(); });
  boot();

  /* ---------- share card ---------- */
  function buildCard() {
    return S.fontsReady(['800 80px Alexandria', '400 40px Alexandria', '600 30px "JetBrains Mono"']).then(function () {
      var Wc = 1080, Hc = 1920, c = document.createElement('canvas'); c.width = Wc; c.height = Hc;
      var x = c.getContext('2d');
      x.fillStyle = '#081d21'; x.fillRect(0, 0, Wc, Hc);
      x.strokeStyle = 'rgba(53,139,154,.12)'; x.lineWidth = 1;
      for (var gx = 0; gx < Wc; gx += 40) { x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, Hc); x.stroke(); }
      for (var gy = 0; gy < Hc; gy += 40) { x.beginPath(); x.moveTo(0, gy); x.lineTo(Wc, gy); x.stroke(); }
      // pixel diamond
      var o = document.createElement('canvas'); o.width = 600; o.height = 480; var og = o.getContext('2d');
      S.drawDiamond(og, 300, 240, 560, { stroke: '#2a636d', lineWidth: 7 });
      var dat = og.getImageData(0, 0, 600, 480).data;
      for (var yy = 0; yy < 480; yy += 8) for (var xx = 0; xx < 600; xx += 8) {
        var k = (yy * 600 + xx) * 4; if (dat[k + 3] < 128) continue;
        x.fillStyle = 'rgb(' + dat[k] + ',' + dat[k + 1] + ',' + dat[k + 2] + ')'; x.fillRect(240 + xx, 300 + yy, 7, 7);
      }
      // name in pixels
      var nf = 210, tmp = document.createElement('canvas').getContext('2d');
      nf = S.fitText(tmp, m.name, 980, 200, '800', 'Alexandria');
      var nc = document.createElement('canvas'); nc.width = 1080; nc.height = 360; var ng = nc.getContext('2d');
      ng.fillStyle = '#fff'; ng.font = '800 ' + nf + 'px Alexandria'; ng.textAlign = 'center'; ng.textBaseline = 'middle'; ng.direction = 'rtl'; ng.fillText(m.name, 540, 180);
      var nd = ng.getImageData(0, 0, 1080, 360).data, step = nf > 120 ? 6 : 4;
      for (yy = 0; yy < 360; yy += step) for (xx = 0; xx < 1080; xx += step) {
        if (nd[(yy * 1080 + xx) * 4 + 3] < 128) continue;
        x.fillStyle = Math.random() < 0.12 ? '#c9b28a' : (Math.random() < 0.5 ? '#ffffff' : '#cfe5e8'); x.fillRect(xx, 940 + yy, step - 1, step - 1);
      }
      x.direction = 'rtl'; x.textAlign = 'center';
      x.fillStyle = '#c9b28a'; x.font = '700 56px Alexandria'; x.fillText(m.title, 540, 1390);
      x.fillStyle = '#cfe5e8'; x.font = '400 40px Alexandria';
      S.wrapLines(x, m.committee, 900).forEach(function (l, i) { x.fillText(l, 540, 1460 + i * 54); });
      x.fillStyle = '#a9c9cd'; x.font = '400 34px Alexandria'; x.fillText(S.CONFIG.month + ' ' + S.CONFIG.year + ' · ' + S.CONFIG.club, 540, 1580);
      x.direction = 'ltr'; x.fillStyle = '#358b9a'; x.font = '400 30px "JetBrains Mono", monospace'; x.fillText('$ compile diamond.dmd  ✓ done', 540, 1700);
      x.direction = 'rtl'; x.fillStyle = '#e9dcc3'; x.font = '600 36px Alexandria'; x.fillText(S.CONFIG.slogan, 540, 1790);
      return c;
    });
  }
  $('#saveBtn').addEventListener('click', function () { S.sound.play('blip'); buildCard().then(function (c) { return S.saveCanvas(c); }); });
  $('#shareBtn').addEventListener('click', function () { S.sound.play('blip'); buildCard().then(function (c) { return S.shareCanvas(c); }); });
})();
</script>
</body>
</html>
